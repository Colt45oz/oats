  /* ---------- app bar + tabs ---------- */

  .do .time{margin-left:auto;flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;
    letter-spacing:.02em;color:var(--acc);background:var(--card);border:1.5px solid var(--acc);border-radius:6px;padding:2px 8px;white-space:nowrap;box-shadow:0 1px 2px rgba(42,33,27,.08)}

  .emboss{position:absolute;left:0;right:0;bottom:10px;z-index:4;pointer-events:none;text-align:center;
    font-family:"Staatliches",Impact,sans-serif;font-size:28px;line-height:1;letter-spacing:.14em;
    color:var(--emboss);text-shadow:0 1.5px 0 var(--emboss-hi),0 -1px 1px var(--emboss-lo)}
  .emboss small{display:block;font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.32em;color:var(--emboss);text-shadow:0 1px 0 var(--emboss-hi);margin-top:2px;font-weight:700}

  .foot{max-width:360px;margin:13px auto 0;display:flex;justify-content:space-between;gap:12px;

  .arrow{text-align:center;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.05em;margin:9px 0 0}

  /* ---------- bottom nav ---------- */
  .navbar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:18px;
    padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(var(--paper) 40%,var(--paper))}
  .nav-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--hair);background:var(--card);color:var(--ink);
    font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .nav-btn:active{transform:scale(.92)}
  .nav-btn:focus-visible{outline:2px solid var(--active);outline-offset:2px}
  .dots{display:flex;gap:9px}
  .dot{width:9px;height:9px;border-radius:50%;border:none;background:var(--hair);cursor:pointer;padding:0;transition:transform .2s,background .2s}
  .dot.active{background:var(--p);transform:scale(1.3)}
</style>
</head>

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function layer(step,cls,L){
  const ings=L.ings.map(i=>`<div class="ing${i.opt?' opt':''}"><span class="o">${i.o}</span><span class="q">${esc(i.q)}</span><span class="n">${esc(i.n)}${i.em?` <em>${esc(i.em)}</em>`:''}</span></div>`).join('');
  const dos=L.dos.map(d=>`<div class="do"><span class="txt">${esc(d.txt)}</span><span class="time">${esc(d.time)}</span></div>`).join('');
  return `<div class="layer ${cls}"><div class="lhead"><span class="lstep">${step}</span><span class="ltitle">${esc(L.title)}</span><span class="lnote">${esc(L.note)}</span></div>${ings}${dos}</div>`;
}
function card(r,i){
  return `<section class="slide ${r.cls}${i===0?' active':''}" data-i="${i}">
    <div class="head">
      ${r.fav?'<div class="favtag">★ Your favorite</div>':''}
      <div class="brandrow">${esc(r.series)}</div>
      <h1>${esc(r.name)}</h1>
      <p class="tag">${esc(r.tag)}</p>
      <div class="specs">
        <div class="spec pro"><div class="v">${r.protein}</div><div class="k">Protein</div></div>
        <div class="spec"><div class="v">${r.cal}</div><div class="k">Calories</div></div>
        <div class="spec"><div class="v">${r.fiber}</div><div class="k">Fiber</div></div>
        <div class="spec"><div class="v">${r.prep}</div><div class="k">Prep</div></div>
      </div>
    </div>
    <div class="jarwrap">
      <div class="cap"></div>
      <div class="jar">
        <div class="shine"></div><div class="shine r"></div>
        <div class="rim"></div>
        ${layer(3,'top',r.top)}
        <div class="seam"><span class="pill chill">then · chill 6h+ overnight</span></div>
        ${layer(2,'wet',r.wet)}
        <div class="seam"><span class="pill pour">pour over ↑</span></div>
        ${layer(1,'base',r.base)}
        <div class="emboss">MASON<small>OVERNIGHT OATS</small></div>
      </div>
    </div>
    <div class="foot"><span>Serves <b>1</b></span><span>Keeps <b>${esc(r.keeps)}</b></span><span>${esc(r.diet)}</span></div>
    <p class="arrow">↑ built bottom to top ·&nbsp; <b>follow 1 → 2 → 3</b></p>
  </section>`;
}

const app=document.getElementById('app'),stage=document.getElementById('stage'),
      tabs=document.getElementById('tabs'),dots=document.getElementById('dots'),count=document.getElementById('count');
stage.innerHTML=RECIPES.map(card).join('');
tabs.innerHTML=RECIPES.map((r,i)=>`<button class="tab ${r.cls}${i===0?' active':''}" data-i="${i}">${esc(r.short)}</button>`).join('');
dots.innerHTML=RECIPES.map((r,i)=>`<button class="dot ${r.cls}${i===0?' active':''}" data-i="${i}" aria-label="${esc(r.name)}"></button>`).join('');

const slides=[...stage.children],tabEls=[...tabs.children],dotEls=[...dots.children];
let cur=0;
function go(i){
  i=(i+RECIPES.length)%RECIPES.length;
  slides[cur].classList.remove('active');tabEls[cur].classList.remove('active');dotEls[cur].classList.remove('active');
  cur=i;
  slides[cur].classList.add('active');tabEls[cur].classList.add('active');dotEls[cur].classList.add('active');
  app.style.setProperty('--active',RECIPES[cur].p);
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(RECIPES.length).padStart(2,'0');
  tabEls[cur].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  stage.scrollIntoView({block:'start',behavior:'smooth'});
}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(+b.dataset.i);});
dots.addEventListener('click',e=>{const b=e.target.closest('.dot');if(b)go(+b.dataset.i);});
document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.getElementById('next').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1);});
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));},{passive:true});
app.style.setProperty('--active',RECIPES[0].p);
</script>

</body>
</html>
